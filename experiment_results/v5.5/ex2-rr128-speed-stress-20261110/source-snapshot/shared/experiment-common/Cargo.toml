[package]
name = "experiment-common"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:log"]

[dependencies]
libc = "0.2"
anyhow = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wgpu = { version = "27.0.1", optional = true }
pollster = { version = "0.4.0", optional = true }
log = { version = "0.4", optional = true }
