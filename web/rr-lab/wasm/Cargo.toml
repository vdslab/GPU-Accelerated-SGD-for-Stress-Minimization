[package]
name = "rr-lab-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
experiment-common = { path = "../../../shared/experiment-common" }
futures-channel = "0.3"
js-sys = "0.3"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
rr-gpu = { path = "../../../implementations/full/rr_gpu" }
sparse-sgd-gpu = { path = "../../../implementations/sparse/sparse-sgd-gpu" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = "27.0.1"
