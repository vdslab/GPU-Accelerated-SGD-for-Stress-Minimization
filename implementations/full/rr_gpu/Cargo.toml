[package]
name = "rr-gpu"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
bytemuck = { version = "1.24.0", features = ["derive"] }
experiment-common = { path = "../../../shared/experiment-common", features = ["gpu"] }
rand = { version = "0.9.2", default-features = false, features = ["std", "std_rng"] }
serde_json = "1"
wgpu = "27.0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4"
env_logger = "0.11.8"
pollster = "0.4.0"
rand = "0.9.2"
sprs = "0.11.4"
# WebGPU BFS integration for accelerated APSP preprocessing
webgpu-bfs-core = { path = "../../../../webgpu-bfs/crates/core" }
webgpu-bfs-gpu = { path = "../../../../webgpu-bfs/crates/gpu_bfs" }

[dev-dependencies]
tempfile = "3"
