<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGD実験用ブラウザ</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>SGD実験用ブラウザ</h1>
      <p id="connection-status" role="status">接続中…</p>
    </header>
    <div class="app-layout">
      <aside class="settings-panel" aria-label="実験設定">
        <div class="settings-heading">
          <h2>実験設定</h2>
          <button id="graph-list-toggle" type="button" aria-controls="graph-list-panel" aria-expanded="false" disabled>リスト</button>
        </div>
        <form id="experiment-form">
          <fieldset id="settings" disabled>
            <div class="fields">
              <div class="graph-field">
                <label for="graph-search">グラフ（ノード数 / エッジ数）</label>
                <div id="graph-picker" class="graph-picker">
                  <div class="graph-search-row">
                    <input id="graph-search" type="text" role="combobox" aria-autocomplete="list" aria-controls="graph-choices" aria-expanded="false" placeholder="グラフ名で検索…" autocomplete="off" spellcheck="false">
                    <button id="graph-dropdown-toggle" type="button" aria-label="グラフの候補を開閉" tabindex="-1">▾</button>
                  </div>
                  <div id="graph-dropdown" class="graph-dropdown" hidden>
                    <div id="graph-choices" role="listbox" aria-label="グラフの候補"></div>
                    <p id="graph-no-match" class="muted" hidden>該当するグラフはありません</p>
                  </div>
                </div>
                <select id="graph" name="graph" aria-label="選択中のグラフ" hidden><option value="">読み込み中…</option></select>
              </div>
              <label>手法
                <select id="method" name="method" required></select>
              </label>
              <label>反復回数
                <select id="iterations" name="iterations">
                  <option>1</option><option>5</option><option>10</option><option selected>15</option><option>30</option><option>50</option><option>100</option>
                </select>
              </label>
              <label>epsilon
                <select id="epsilon" name="epsilon">
                  <option>0.01</option><option>0.05</option><option selected>0.1</option><option>0.2</option><option>0.5</option>
                </select>
              </label>
              <label>pivots（Sparseのみ）
                <select id="pivots" name="pivots">
                  <option>16</option><option>32</option><option>64</option><option>100</option><option selected>200</option><option>500</option><option>1000</option>
                </select>
              </label>
              <label>seed
                <select id="seed" name="seed">
                  <option selected>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option>
                </select>
              </label>
              <label>画像サイズ
                <select id="image-size" name="image_size">
                  <option value="512x512">512 × 512</option><option value="1024x1024">1024 × 1024</option><option value="2048x2048" selected>2048 × 2048</option><option value="4096x4096">4096 × 4096</option>
                </select>
              </label>
            </div>
            <p id="graph-info" class="muted"></p>
            <button id="run" type="submit">実験を実行</button>
          </fieldset>
        </form>
        <details id="connection-settings">
          <summary>接続設定</summary>
          <div class="command-row">
            <pre id="server-command">python3 experiments/serve_single.py</pre>
            <button id="copy-command" class="copy-command" type="button" title="起動コマンドをコピー" aria-label="起動コマンドをコピー">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2"></rect>
                <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
              </svg>
            </button>
          </div>
          <p id="command-copy-status" class="muted" role="status"></p>
          <div class="connection-controls">
            <label for="api-url">API URL</label>
            <input id="api-url" type="url" value="http://127.0.0.1:8765" spellcheck="false">
            <button id="connect" type="button">接続・再読み込み</button>
          </div>
        </details>
      </aside>
      <section class="work-area" aria-label="実験結果と画像">
        <section id="graph-list-panel" class="graph-list-panel" aria-label="グラフリスト" hidden>
          <div class="panel-heading">
            <h2>グラフリスト <span id="graph-list-count" class="muted"></span></h2>
            <button id="graph-list-close" type="button">閉じる</button>
          </div>
          <div class="graph-table-scroll">
            <table id="graph-table">
              <thead><tr id="graph-table-head"></tr></thead>
              <tbody id="graph-table-body"></tbody>
            </table>
            <p id="graph-table-empty" class="muted" hidden>該当するグラフはありません</p>
          </div>
        </section>
        <section id="results-panel" class="results-panel">
          <div class="panel-heading">
            <h2>結果</h2>
            <p id="run-status" role="status" aria-live="polite">未実行</p>
          </div>
          <p id="error" role="alert" hidden></p>
          <div id="results" class="result-grid" hidden>
            <div class="measurements">
              <table id="metrics" hidden><tbody id="metric-rows"></tbody></table>
              <p class="timing-note">時間はビルド・画像生成・stress評価を除く</p>
              <p id="artifact-links" class="actions"></p>
              <details id="log-details" hidden>
                <summary>実行ログ</summary>
                <textarea id="log" rows="5" readonly spellcheck="false" aria-label="実行ログ"></textarea>
              </details>
            </div>
            <div class="copy-panel">
              <div class="actions">
                <button id="copy-result" type="button" disabled>結果をコピー</button>
                <button id="copy-json" type="button" disabled>JSONをコピー</button>
                <span id="copy-status" role="status"></span>
              </div>
              <textarea id="result-text" rows="8" readonly spellcheck="false" aria-label="コピー用の結果"></textarea>
            </div>
          </div>
        </section>
        <section class="images" aria-label="グラフ画像">
          <figure>
            <figcaption>Before（初期配置）</figcaption>
            <button id="before-link" class="image-preview" type="button" aria-label="Before画像を拡大" hidden><img id="before-image" alt="実験前のグラフ配置"></button>
            <p id="before-placeholder" class="muted">未実行</p>
          </figure>
          <figure>
            <figcaption>After（実行後）</figcaption>
            <button id="after-link" class="image-preview" type="button" aria-label="After画像を拡大" hidden><img id="after-image" alt="実験後のグラフ配置"></button>
            <p id="after-placeholder" class="muted">未実行</p>
          </figure>
        </section>
      </section>
    </div>
  </main>
  <dialog id="image-dialog" aria-labelledby="image-title">
    <div class="dialog-heading">
      <h2 id="image-title"></h2>
      <button id="close-image" type="button" aria-label="拡大画像を閉じる">閉じる</button>
    </div>
    <img id="expanded-image" alt="">
  </dialog>
</body>
</html>
